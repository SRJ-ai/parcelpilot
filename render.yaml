services:
  - type: web
    name: parcelpilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY      # set in dashboard (secret)
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: DATABASE_URL      # Supabase session-pooler URI
        sync: false
      - key: OLLAMA_API_KEY
        sync: false

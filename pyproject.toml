[project]
name = "parcelpilot"
version = "0.1.0"
description = "ParcelPilot AI support system (customer + internal ops chatbot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
